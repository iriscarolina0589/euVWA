name: Vulnerable CI Pipeline

on:
  push:
    branches: [ "main-vulnerable" ]

jobs:
  security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (SAST)
        run: npx eslint main-vulnerable/src

      - name: Build Docker image
        run: docker build -t euvwa-vulnerable .

      - name: Trivy scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: euvwa-vulnerable
          severity: HIGH,CRITICAL
          exit-code: 1